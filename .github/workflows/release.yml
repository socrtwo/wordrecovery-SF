name: Release (multi-platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.1.0)'
        required: false
      ref:
        description: 'Ref (tag/branch) to checkout and release from (e.g. v3.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  web:
    name: Web (PWA zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Package web/
        run: |
          set -e
          cd web && zip -r ../wordrecovery-web.zip . && cd ..
          ls -la wordrecovery-web.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          name: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          files: wordrecovery-web.zip
          fail_on_unmatched_files: false

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          releaseName: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          releaseDraft: false
          prerelease: false
          projectPath: src-tauri
          args: ''

  desktop-windows:
    name: Desktop (windows-latest, signed)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build Windows bundles (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: ''
      - name: Stage Windows artifacts for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _signed | Out-Null
          $bundleDir = "src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundleDir -Recurse -Include *.exe,*.msi -File | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination _signed/ -Force
          }
          Get-ChildItem _signed
      # Sign the top-level .exe and .msi with Azure Trusted Signing before upload.
      - name: Sign Windows binaries (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: _signed
          files-folder-filter: exe,msi,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload signed Windows artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          name: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          files: |
            _signed/*.exe
            _signed/*.msi
          fail_on_unmatched_files: false

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Capacitor sync + build
        working-directory: mobile
        run: |
          set -e
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug
          find app/build/outputs -name '*.apk' -type f
      - name: Stage APK
        run: |
          set -e
          mkdir -p _out
          find mobile/android/app/build/outputs -name '*.apk' -type f -exec cp {} _out/ \;
          ls -la _out/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          name: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          files: _out/*.apk
          fail_on_unmatched_files: false

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capacitor sync + archive
        working-directory: mobile
        run: |
          set -e
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r WordRecovery-unsigned.ipa Payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          name: ${{ github.event.inputs.ref || github.ref_name || inputs.tag }}
          files: mobile/ios/App/build/WordRecovery-unsigned.ipa
          fail_on_unmatched_files: false
